<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

  <link
    href="https://fonts.cdnfonts.com/css/jungle-adventurer"
    rel="stylesheet"
  >

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CyberCatch</title>


  <style>

    body {
      font-family: 'Jungle Adventurer', Arial, sans-serif !important;
      text-align: center;
      background-color: #d3d3d3;
      color: black;
      overflow: hidden;
      padding-top: 20px;
      margin: 0;
    }


    h1 {
      margin-bottom: 5px;
    }


    #instruction-text {
      margin-top: 5px;
    }


    .game-container {
      position: relative;
      width: 450px;
      height: 400px;
      margin: 25px auto 10px;
    }


    .player {
      width: 80px;
      height: 80px;

      background-color: #808080;

      border-radius: 50%;

      position: absolute;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      font-weight: bold;
      color: white;

      cursor: pointer;

      border: 3px solid transparent;

      box-sizing: border-box;

      z-index: 2;
    }


    .player.has-ball {
      border-color: #2ecc71;
    }


    .avatar-icon {
      font-size: 32px;
      line-height: 32px;
      pointer-events: none;
    }


    .player-name {
      font-size: 11px;
      margin-top: 3px;

      max-width: 70px;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;

      pointer-events: none;
    }


    .ball {
      width: 20px;
      height: 20px;

      background-color: #2ecc71;

      border-radius: 50%;

      position: absolute;

      transition:
        left 0.6s ease-in-out,
        top 0.6s ease-in-out;

      z-index: 5;

      pointer-events: none;
    }


    #loading-screen,
    #waiting-screen {

      position: fixed;

      width: 100%;
      height: 100%;

      top: 0;
      left: 0;

      background: #d3d3d3;

      justify-content: center;
      align-items: center;
      flex-direction: column;

      z-index: 10;
    }


    #loading-screen {
      display: flex;
    }


    #waiting-screen {
      display: none;
    }


    #waiting-screen img {
      width: 100px;
      margin-top: 20px;
    }


    #end-early-btn {

      font-family:
        'Jungle Adventurer',
        Arial,
        sans-serif !important;

      margin-top: 15px;

      padding: 10px 20px;

      font-size: 16px;

      cursor: pointer;

      background-color: #e74c3c;

      color: white;

      border: none;

      border-radius: 5px;

      display: none;
    }


    #info {
      min-height: 25px;
      margin-top: -5px;
      font-weight: bold;
    }

  </style>

</head>


<body>


<div id="loading-screen">
  <h2>Loading...</h2>
</div>


<div id="waiting-screen">

  <h2>
    Waiting for other players to log in...
  </h2>

  <img
    src="https://icon-library.com/images/waiting-icon-gif/waiting-icon-gif-1.jpg"
    alt="Waiting..."
  >

</div>



<div
  id="game-screen"
  style="display:none;"
>


  <h1>
    CyberCatch
  </h1>


  <p id="instruction-text">
    Click on a player to pass the ball when it's your turn.
  </p>



  <div
    class="game-container"
    id="game-container"
  >


    <!-- =====================================================
         PLAYER B
         QUALTRICS player1
         TAYLOR
         TOP
         ===================================================== -->

    <div
      class="player"
      id="playerB"
      style="left:185px; top:15px;"
    >

      <div
        class="avatar-icon"
        id="playerB-avatar-icon"
      >
        👤
      </div>

      <div
        class="player-name"
        id="playerB-avatar-name"
      >
        Taylor
      </div>

    </div>



    <!-- =====================================================
         PLAYER C
         QUALTRICS player2
         ALEX
         RIGHT
         ===================================================== -->

    <div
      class="player"
      id="playerC"
      style="left:335px; top:150px;"
    >

      <div
        class="avatar-icon"
        id="playerC-avatar-icon"
      >
        👤
      </div>

      <div
        class="player-name"
        id="playerC-avatar-name"
      >
        Alex
      </div>

    </div>



    <!-- =====================================================
         PLAYER E
         QUALTRICS player3
         USER
         BOTTOM
         ===================================================== -->

    <div
      class="player"
      id="playerE"
      style="left:185px; top:285px;"
    >

      <div
        class="avatar-icon"
        id="playerE-avatar-icon"
      >
        👤
      </div>

      <div
        class="player-name"
        id="playerE-avatar-name"
      >
        User
      </div>

    </div>



    <!-- =====================================================
         PARTICIPANT
         LEFT
         ===================================================== -->

    <div
      class="player"
      id="player0"
      style="left:35px; top:150px;"
    >

      <div
        class="avatar-icon"
        id="participant-avatar-icon"
      >
        👤
      </div>

      <div
        class="player-name"
        id="participant-avatar-name"
      >
        You
      </div>

    </div>



    <div
      class="ball"
      id="ball"
    ></div>


  </div>



  <div
    class="info"
    id="info"
  >
    The game is starting...
  </div>



  <button
    id="end-early-btn"
    onclick="endGame()"
  >
    End Game
  </button>


</div>



<script>


/* =========================================================
   DATA
   ========================================================= */


let nickname =
  "You";


let participantIcon =
  "DOG";


let participantColor =
  "GREEN";


let participantDataReceived =
  false;


let gameStarted =
  false;



/* =========================================================
   AVATAR MAPS
   ========================================================= */


const iconMap = {

  "1": "🐶",
  "2": "🐱",
  "3": "🦉",

  "DOG": "🐶",
  "CAT": "🐱",
  "OWL": "🦉"

};



const colorMap = {

  "1": "#e74c3c",
  "2": "#2ecc71",
  "3": "#ff69b4",

  "RED": "#e74c3c",
  "GREEN": "#2ecc71",
  "PINK": "#ff69b4"

};



/* =========================================================
   ICON NORMALIZATION
   ========================================================= */


function getIcon(value) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {
    return "👤";
  }


  const raw =
    String(value).trim();


  /*
     If Qualtrics already sends an emoji,
     use it directly.
  */

  if (
    raw === "🐶" ||
    raw === "🐱" ||
    raw === "🦉"
  ) {
    return raw;
  }


  const normalized =
    raw.toUpperCase();


  return (
    iconMap[normalized] ||
    "👤"
  );

}



/* =========================================================
   COLOR NORMALIZATION
   ========================================================= */


function getColor(
  value,
  fallbackColor
) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {
    return fallbackColor;
  }


  const raw =
    String(value).trim();


  /*
     Allow an actual hex color
     if Qualtrics sends one.
  */

  if (
    /^#[0-9A-F]{6}$/i.test(raw)
  ) {
    return raw;
  }


  const normalized =
    raw.toUpperCase();


  return (
    colorMap[normalized] ||
    fallbackColor
  );

}



/* =========================================================
   APPLY AVATAR
   ========================================================= */


function applyAvatar(
  playerId,
  playerName,
  iconValue,
  colorValue,
  fallbackColor
) {

  const player =
    document.getElementById(
      playerId
    );


  if (!player) {
    return;
  }


  const icon =
    player.querySelector(
      ".avatar-icon"
    );


  const name =
    player.querySelector(
      ".player-name"
    );


  if (icon) {

    icon.innerText =
      getIcon(
        iconValue
      );

  }


  if (name) {

    name.innerText =
      playerName;

  }


  player.style.backgroundColor =
    getColor(
      colorValue,
      fallbackColor
    );

}



/* =========================================================
   APPLY PARTICIPANT
   ========================================================= */


function applyParticipantAvatar() {

  applyAvatar(
    "player0",
    nickname,
    participantIcon,
    participantColor,
    "#2ecc71"
  );

}



/* =========================================================
   RECEIVE DATA FROM QUALTRICS

   CONNECTION:

   Qualtrics player1 -> Taylor -> playerB
   Qualtrics player2 -> Alex   -> playerC
   Qualtrics player3 -> User   -> playerE
   ========================================================= */


window.addEventListener(
  "message",
  function(event) {


    if (
      !event.data ||
      typeof event.data !== "object"
    ) {
      return;
    }


    if (
      event.data.type !==
      "CyberCatchParticipantData"
    ) {
      return;
    }



    console.log(
      "CyberCatch received Qualtrics data:",
      event.data
    );



    /* =========================
       PARTICIPANT
       ========================= */


    if (
      event.data.participant_name
    ) {

      nickname =
        String(
          event.data.participant_name
        );

    }



    if (
      event.data.participant_icon
    ) {

      participantIcon =
        String(
          event.data.participant_icon
        );

    }



    if (
      event.data.participant_color
    ) {

      participantColor =
        String(
          event.data.participant_color
        );

    }



    applyParticipantAvatar();



    /* =========================
       PLAYER 1
       TAYLOR = B
       ========================= */


    applyAvatar(

      "playerB",

      "Taylor",

      event.data.player1_icon,

      event.data.player1_color,

      "#808080"

    );



    /* =========================
       PLAYER 2
       ALEX = C
       ========================= */


    applyAvatar(

      "playerC",

      "Alex",

      event.data.player2_icon,

      event.data.player2_color,

      "#808080"

    );



    /* =========================
       PLAYER 3
       USER = E
       ========================= */


    applyAvatar(

      "playerE",

      "User",

      event.data.player3_icon,

      event.data.player3_color,

      "#808080"

    );



    participantDataReceived =
      true;



    if (!gameStarted) {

      startWaiting();

    }

  }
);



/* =========================================================
   READY HANDSHAKE WITH QUALTRICS
   ========================================================= */


let readyAttempts =
  0;


function tellQualtricsReady() {


  window.parent.postMessage(
    {
      type: "CyberCatchReady"
    },
    "*"
  );


  readyAttempts++;


  /*
     Repeat handshake in case the Qualtrics
     listener was not ready on first load.
  */

  if (
    !participantDataReceived &&
    readyAttempts < 20
  ) {

    setTimeout(
      tellQualtricsReady,
      500
    );

  }

}



window.addEventListener(
  "DOMContentLoaded",
  function() {

    tellQualtricsReady();

  }
);



/* =========================================================
   GAME SETTINGS
   ========================================================= */


const aiPlayers = [

  "playerB",
  "playerC",
  "playerE"

];



/*
   Returning rates apply ONLY
   to independent participant throws.
*/


const returningRates = {

  playerB: 0.25,

  playerC: 0.75,

  playerE: 0.50

};



const TOTAL_THROWS =
  72;


const INDEPENDENT_THROWS_TOTAL =
  48;


const FORCED_THROWS_TOTAL =
  24;



/* =========================================================
   GAME STATE
   ========================================================= */


let currentPlayer =
  "playerB";


let previousPlayer =
  null;


let totalThrows =
  0;


let independentThrowsCompleted =
  0;


let forcedThrowsCompleted =
  0;


let gameEnded =
  false;


let gameLog =
  [];


let lastPlayerReceiveTime =
  null;


let remainingHopsBeforeReturn =
  0;



/* =========================================================
   THROW SEQUENCE
   ========================================================= */


let throwSequence =
  [];



function createThrowSequence() {


  const blocks =
    [];


  /*
     24 blocks:
     Independent -> Forced
  */


  for (
    let i = 0;
    i < FORCED_THROWS_TOTAL;
    i++
  ) {

    blocks.push(
      [
        "independent",
        "forced"
      ]
    );

  }



  /*
     24 additional
     independent throws.
  */


  for (
    let i = 0;
    i < 24;
    i++
  ) {

    blocks.push(
      [
        "independent"
      ]
    );

  }



  /*
     Shuffle blocks.
  */


  for (
    let i = blocks.length - 1;
    i > 0;
    i--
  ) {


    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      blocks[i],
      blocks[j]
    ] =
    [
      blocks[j],
      blocks[i]
    ];

  }



  throwSequence =
    blocks.flat();



  console.log(
    "Throw sequence:",
    throwSequence
  );


  console.log(
    "Sequence length:",
    throwSequence.length
  );

}



createThrowSequence();



function isNextThrowForced() {

  return (
    throwSequence[
      totalThrows
    ] ===
    "forced"
  );

}



/* =========================================================
   GET PLAYER NAME
   ========================================================= */


function getPlayerName(
  playerId
) {


  if (
    playerId === "player0"
  ) {

    return nickname;

  }


  const player =
    document.getElementById(
      playerId
    );


  if (!player) {

    return playerId;

  }


  const name =
    player.querySelector(
      ".player-name"
    );


  return (
    name
      ? name.innerText
      : playerId
  );

}



/* =========================================================
   WAITING SCREEN
   ========================================================= */


function startWaiting() {


  if (gameStarted) {
    return;
  }


  gameStarted =
    true;


  document
    .getElementById(
      "loading-screen"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "waiting-screen"
    )
    .style.display =
    "flex";


  setTimeout(
    startGame,
    4000
  );

}



/* =========================================================
   START GAME
   ========================================================= */


function startGame() {


  document
    .getElementById(
      "waiting-screen"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "game-screen"
    )
    .style.display =
    "block";



  currentPlayer =
    "playerB";


  previousPlayer =
    null;



  updateBallHolderVisual(
    currentPlayer
  );



  /*
     PARTICIPANT CLICK BEHAVIOR
  */


  document
    .querySelectorAll(
      ".player"
    )
    .forEach(
      function(player) {


        player.addEventListener(
          "click",
          function() {


            if (
              gameEnded ||
              currentPlayer !== "player0"
            ) {
              return;
            }



            /*
               Participant cannot
               throw to themselves.
            */


            if (
              this.id === "player0"
            ) {
              return;
            }



            /*
               Forced throw:
               must return to sender.
            */


            if (
              isNextThrowForced() &&
              this.id !== previousPlayer
            ) {


              document
                .getElementById(
                  "info"
                )
                .innerText =
                "You must return the ball to the player who threw it.";


              return;

            }



            processThrow(
              "player0",
              this.id,
              "Player"
            );

          }
        );

      }
    );



  setTimeout(
    function() {

      aiTurn();

    },
    getRandomDelay()
  );

}



/* =========================================================
   PROCESS THROW
   ========================================================= */


function processThrow(
  fromId,
  toId,
  type
) {


  if (gameEnded) {
    return;
  }



  const throwIsForced =
    isNextThrowForced();



  if (
    throwIsForced &&
    forcedThrowsCompleted >=
      FORCED_THROWS_TOTAL
  ) {

    console.error(
      "Too many forced throws."
    );

    return;

  }



  if (
    !throwIsForced &&
    independentThrowsCompleted >=
      INDEPENDENT_THROWS_TOTAL
  ) {

    console.error(
      "Too many independent throws."
    );

    return;

  }



  const senderId =
    fromId;



  totalThrows++;



  if (
    throwIsForced
  ) {

    forcedThrowsCompleted++;

  }

  else {

    independentThrowsCompleted++;

  }



  updateBallHolder(
    toId,
    senderId
  );



  /* =======================================================
     PARTICIPANT THROW
     ======================================================= */


  if (
    type === "Player"
  ) {


    const rt =
      lastPlayerReceiveTime
        ? Date.now() -
          lastPlayerReceiveTime
        : null;


    lastPlayerReceiveTime =
      null;



    gameLog.push(
      {

        throwNum:
          totalThrows,

        throwType:
          throwIsForced
            ? "forced"
            : "independent",

        forced:
          throwIsForced,

        createsForcedReturn:
          !throwIsForced &&
          isNextThrowForced(),

        from:
          nickname,

        fromId:
          "player0",

        to:
          getPlayerName(
            toId
          ),

        targetId:
          toId,

        rt:
          rt,

        timestamp:
          Date.now()

      }
    );



    /*
       Contingent return probability
       applies to independent
       participant -> AI throws.
    */


    if (
      !throwIsForced &&
      toId !== "player0"
    ) {


      const returnProb =
        returningRates[
          toId
        ];



      if (
        Math.random() <
        returnProb
      ) {

        remainingHopsBeforeReturn =
          0;

      }

      else {

        remainingHopsBeforeReturn =
          2;

      }

    }



    /*
       If next throw is forced,
       forced return overrides
       contingent plan.
    */


    if (
      !throwIsForced &&
      isNextThrowForced()
    ) {

      remainingHopsBeforeReturn =
        0;

    }

  }



  /* =======================================================
     AI THROW
     ======================================================= */


  else {


    gameLog.push(
      {

        throwNum:
          totalThrows,

        throwType:
          throwIsForced
            ? "forced"
            : "independent",

        forced:
          throwIsForced,

        createsForcedReturn:
          !throwIsForced &&
          isNextThrowForced(),

        from:
          getPlayerName(
            fromId
          ),

        fromId:
          fromId,

        to:
          getPlayerName(
            toId
          ),

        targetId:
          toId,

        timestamp:
          Date.now()

      }
    );

  }



  /* =======================================================
     INFORMATION TEXT
     ======================================================= */


  if (
    throwIsForced
  ) {


    if (
      toId === "player0"
    ) {


      document
        .getElementById(
          "info"
        )
        .innerText =
        getPlayerName(
          fromId
        ) +
        " passed the ball to you. You must return the ball to the player who threw it.";

    }


    else {


      document
        .getElementById(
          "info"
        )
        .innerText =
        getPlayerName(
          toId
        ) +
        " must return the ball to the player who threw it.";

    }

  }



  else if (
    isNextThrowForced() &&
    toId === "player0"
  ) {


    document
      .getElementById(
        "info"
      )
      .innerText =
      getPlayerName(
        fromId
      ) +
      " passed the ball to you. You must return the ball to the player who threw it.";

  }



  else {


    if (
      toId === "player0"
    ) {


      document
        .getElementById(
          "info"
        )
        .innerText =
        getPlayerName(
          fromId
        ) +
        " passed the ball to you – it's your turn!";

    }


    else {


      document
        .getElementById(
          "info"
        )
        .innerText =
        getPlayerName(
          fromId
        ) +
        " passed the ball to " +
        getPlayerName(
          toId
        );

    }

  }



  if (
    totalThrows >=
    TOTAL_THROWS
  ) {

    endGame();

    return;

  }



  if (
    toId !== "player0"
  ) {


    setTimeout(
      function() {

        aiTurn();

      },
      getRandomDelay()
    );

  }

}



/* =========================================================
   UPDATE BALL HOLDER
   ========================================================= */


function updateBallHolderVisual(
  newHolder
) {


  const target =
    document.getElementById(
      newHolder
    );


  if (!target) {
    return;
  }



  document
    .querySelectorAll(
      ".player"
    )
    .forEach(
      function(player) {

        player.classList.remove(
          "has-ball"
        );

      }
    );



  target.classList.add(
    "has-ball"
  );



  moveBall(
    newHolder
  );


  currentPlayer =
    newHolder;

}



/* =========================================================
   FULL HOLDER UPDATE
   ========================================================= */


function updateBallHolder(
  newHolder,
  senderId
) {


  previousPlayer =
    senderId;


  updateBallHolderVisual(
    newHolder
  );



  if (
    newHolder === "player0"
  ) {

    lastPlayerReceiveTime =
      Date.now();

  }

}



/* =========================================================
   MOVE BALL
   ========================================================= */


function moveBall(
  targetId
) {


  const ball =
    document.getElementById(
      "ball"
    );


  const target =
    document.getElementById(
      targetId
    );


  const container =
    document.getElementById(
      "game-container"
    );


  if (
    !ball ||
    !target ||
    !container
  ) {
    return;
  }



  const tRect =
    target.getBoundingClientRect();


  const cRect =
    container.getBoundingClientRect();



  const x =
    tRect.left -
    cRect.left +
    target.offsetWidth / 2 -
    ball.offsetWidth / 2;



  const y =
    tRect.top -
    cRect.top +
    target.offsetHeight / 2 -
    ball.offsetHeight / 2;



  ball.style.left =
    x + "px";


  ball.style.top =
    y + "px";

}



/* =========================================================
   RANDOM AI DELAY
   ========================================================= */


function getRandomDelay() {

  return (
    Math.floor(
      Math.random() *
      800
    ) +
    1200
  );

}



/* =========================================================
   AI TURN
   ========================================================= */


function aiTurn() {


  if (
    gameEnded ||
    totalThrows >=
      TOTAL_THROWS
  ) {

    endGame();

    return;

  }



  let next;



  const throwIsForced =
    isNextThrowForced();



  /* =======================================================
     FORCED AI THROW
     ======================================================= */


  if (
    throwIsForced
  ) {


    next =
      previousPlayer;



    if (
      !next ||
      next === currentPlayer
    ) {


      console.error(
        "Invalid forced throw:",
        {
          currentPlayer:
            currentPlayer,

          previousPlayer:
            previousPlayer,

          totalThrows:
            totalThrows
        }
      );


      return;

    }



    remainingHopsBeforeReturn =
      0;

  }



  /* =======================================================
     INDEPENDENT AI THROW
     ======================================================= */


  else {


    if (
      remainingHopsBeforeReturn ===
      0
    ) {


      next =
        "player0";

    }


    else {


      remainingHopsBeforeReturn--;



      const otherAIs =
        aiPlayers.filter(
          function(playerId) {

            return (
              playerId !==
              currentPlayer
            );

          }
        );



      next =
        otherAIs[
          Math.floor(
            Math.random() *
            otherAIs.length
          )
        ];

    }

  }



  processThrow(
    currentPlayer,
    next,
    "AI"
  );

}



/* =========================================================
   END GAME
   ========================================================= */


function endGame() {


  if (gameEnded) {
    return;
  }


  gameEnded =
    true;



  console.log(
    "FINAL GAME COUNTS:",
    {

      totalThrows:
        totalThrows,

      independentThrows:
        independentThrowsCompleted,

      forcedThrows:
        forcedThrowsCompleted

    }
  );



  gameLog.push(
    {

      logType:
        "GameSummary",

      totalThrows:
        totalThrows,

      independentThrows:
        independentThrowsCompleted,

      forcedThrows:
        forcedThrowsCompleted,

      timestamp:
        Date.now()

    }
  );



  const gameLogString =
    JSON.stringify(
      gameLog
    );



  if (
    window.Qualtrics &&
    Qualtrics.SurveyEngine
  ) {


    Qualtrics.SurveyEngine
      .setEmbeddedData(
        "CyberCatchLog",
        gameLogString
      );

  }


  else {


    window.parent.postMessage(
      {

        type:
          "CyberCatchLog",

        gameLog:
          gameLogString,

        participant_name:
          nickname,

        participant_icon:
          participantIcon,

        participant_color:
          participantColor

      },
      "*"
    );

  }



  document.body.innerHTML = `

    <div
      style="
        background-color:#d3d3d3;
        width:100vw;
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        flex-direction:column;
      "
    >

      <div
        style="
          font-size:24px;
          font-weight:bold;
          color:#2c3e50;
        "
      >
        The task has ended. Thank you!
      </div>

    </div>

  `;

}


</script>
