<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

  <link
    href="https://fonts.cdnfonts.com/css/jungle-adventurer"
    rel="stylesheet"
  >

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CyberCatch</title>


  <style>

    body {
      font-family: 'Jungle Adventurer', Arial, sans-serif !important;
      text-align: center;
      background-color: #d3d3d3;
      color: black;
      overflow: hidden;
      padding-top: 20px;
      margin: 0;
    }

    h1 {
      margin-bottom: 5px;
    }

    #instruction-text {
      margin-top: 5px;
    }

    .game-container {
      position: relative;
      width: 450px;
      height: 400px;
      margin: 25px auto 10px;
    }

    .player {
      width: 80px;
      height: 80px;

      border-radius: 50%;
      position: absolute;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      font-weight: bold;
      color: white;

      cursor: pointer;

      border: 3px solid transparent;
      box-sizing: border-box;

      z-index: 2;
    }

    .player.has-ball {
      border-color: #2ecc71;
    }

    .avatar-icon {
      font-size: 34px;
      line-height: 34px;
      pointer-events: none;
    }

    .player-name {
      font-size: 11px;
      margin-top: 3px;
      max-width: 70px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .error-icon {
      font-size: 30px;
      line-height: 30px;
    }


    /* =====================================================
       NORMAL BALL
       ===================================================== */

    .ball {
      width: 24px;
      height: 24px;

      background-color: #2ecc71;

      border-radius: 50%;

      position: absolute;

      transition:
        left 0.6s ease-in-out,
        top 0.6s ease-in-out;

      z-index: 5;

      pointer-events: none;
    }


    /* =====================================================
       FORCED THROW = STAR
       ===================================================== */

    .ball.forced-ball {
      border-radius: 0;

      clip-path: polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 92%,
        50% 70%,
        21% 92%,
        32% 57%,
        2% 35%,
        39% 35%
      );
    }


    #loading-screen,
    #waiting-screen {
      position: fixed;

      width: 100%;
      height: 100%;

      top: 0;
      left: 0;

      background: #d3d3d3;

      justify-content: center;
      align-items: center;
      flex-direction: column;

      z-index: 10;
    }

    #loading-screen {
      display: flex;
    }

    #waiting-screen {
      display: none;
    }

    #waiting-screen img {
      width: 100px;
      margin-top: 20px;
    }

    #info {
      min-height: 24px;
      margin-top: -5px;
      font-weight: bold;
      font-size: 16px;
    }

    #forced-note {
      min-height: 20px;
      margin-top: 4px;

      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: normal;
    }

    #end-early-btn {
      display: none;
    }

  </style>

</head>


<body>


<!-- =====================================================
     LOADING
     ===================================================== -->

<div id="loading-screen">

  <h2>
    Loading...
  </h2>

</div>



<!-- =====================================================
     WAITING
     ===================================================== -->

<div id="waiting-screen">

  <h2>
    Waiting for other players to log in...
  </h2>

  <img
    src="https://icon-library.com/images/waiting-icon-gif/waiting-icon-gif-1.jpg"
    alt="Waiting..."
  >

</div>



<!-- =====================================================
     GAME
     ===================================================== -->

<div
  id="game-screen"
  style="display:none;"
>


  <h1>
    CyberCatch
  </h1>


  <p id="instruction-text">
    Click on a player to pass the ball when it's your turn.
  </p>



  <div
    class="game-container"
    id="game-container"
  >


    <!-- =================================================
         TAYLOR
         TOP
         ================================================= -->

    <div
      class="player"
      id="playerB"
      style="
        left:185px;
        top:20px;
        background-color:#F5B041;
      "
    >

      <div class="avatar-icon">
        🐰
      </div>

      <div class="player-name">
        Taylor
      </div>

    </div>



    <!-- =================================================
         ALEX
         RIGHT
         ================================================= -->

    <div
      class="player"
      id="playerC"
      style="
        left:335px;
        top:150px;
        background-color:#AF7AC5;
      "
    >

      <div class="avatar-icon">
        🐧
      </div>

      <div class="player-name">
        Alex
      </div>

    </div>



    <!-- =================================================
         USER / ERROR
         LEFT
         ================================================= -->

    <div
      class="player"
      id="playerE"
      style="

      "
    >

        ⚠
      </div>

      </div>

    </div>



    <!-- =================================================
         PARTICIPANT
         BOTTOM
         FROM QUALTRICS
         ================================================= -->

    <div
      class="player"
      id="player0"
      style="
        left:185px;
        top:280px;
        background-color:#808080;
      "
    >

      <div
        class="avatar-icon"
        id="participant-avatar-icon"
      ></div>

      <div
        class="player-name"
        id="participant-avatar-name"
      >
        You
      </div>

    </div>



    <div

  </div>



  <div

  </div>

</div>



<script>


/* =========================================================
   PARTICIPANT DATA
   ========================================================= */

let nickname = "You";

let participantIcon = "";

let participantColor = "";

let participantDataReceived = false;

let gameStarted = false;



/* =========================================================
   AVATAR MAPS
   ========================================================= */

const iconMap = {

  "1": "🐶",
  "2": "🐱",
  "3": "🦉",

  "DOG": "🐶",
  "CAT": "🐱",
  "OWL": "🦉"

};


const colorMap = {

  "1": "#e74c3c",
  "2": "#2ecc71",
  "3": "#ff69b4",

  "RED": "#e74c3c",
  "GREEN": "#2ecc71",
  "PINK": "#ff69b4"

};



/* =========================================================
   APPLY PARTICIPANT AVATAR
   ========================================================= */

function applyParticipantAvatar() {

  const participant =
    document.getElementById("player0");

  const icon =
    document.getElementById(
      "participant-avatar-icon"
    );

  const name =
    document.getElementById(
      "participant-avatar-name"
    );


  if (name) {

    name.innerText =
      nickname || "You";

  }


  if (icon) {

    const rawIcon =
      String(
        participantIcon || ""
      ).trim();

    const normalizedIcon =
      rawIcon.toUpperCase();


    if (
      rawIcon === "🐶" ||
      rawIcon === "🐱" ||
      rawIcon === "🦉"
    ) {

      icon.innerText =
        rawIcon;

    }

    else {

      icon.innerText =
        iconMap[
          normalizedIcon
        ] || "";

    }

  }


  if (participant) {

    const rawColor =
      String(
        participantColor || ""
      ).trim();

    const normalizedColor =
      rawColor.toUpperCase();


    if (
      /^#[0-9A-F]{6}$/i.test(
        rawColor
      )
    ) {

      participant.style.backgroundColor =
        rawColor;

    }

    else {

      participant.style.backgroundColor =
        colorMap[
          normalizedColor
        ] || "#808080";

    }

  }

}



/* =========================================================
   RECEIVE DATA FROM QUALTRICS
   ========================================================= */

window.addEventListener(
  "message",
  function(event) {

    if (
      !event.data ||
      typeof event.data !== "object"
    ) {
      return;
    }


    if (
      event.data.type !==
      "CyberCatchParticipantData"
    ) {
      return;
    }


    if (
      event.data.participant_name
    ) {

      nickname =
        String(
          event.data.participant_name
        );

    }


    if (
      event.data.participant_icon
    ) {

      participantIcon =
        String(
          event.data.participant_icon
        );

    }


    if (
      event.data.participant_color
    ) {

      participantColor =
        String(
          event.data.participant_color
        );

    }


    applyParticipantAvatar();


    participantDataReceived =
      true;


    if (!gameStarted) {

      startWaiting();

    }

  }
);



/* =========================================================
   QUALTRICS READY
   ========================================================= */

let readyAttempts = 0;


function tellQualtricsReady() {

  window.parent.postMessage(
    {
      type: "CyberCatchReady"
    },
    "*"
  );


  readyAttempts++;


  if (
    !participantDataReceived &&
    readyAttempts < 20
  ) {

    setTimeout(
      tellQualtricsReady,
      500
    );

  }

}


window.addEventListener(
  "DOMContentLoaded",
  tellQualtricsReady
);



/* =========================================================
   PLAYERS
   ========================================================= */

const aiPlayers = [

  "playerB",
  "playerC",
  "playerE"

];



/* =========================================================
   RETURNING RATES

   These apply ONLY to independent participant throws.
   ========================================================= */

const returningRates = {

  playerB: 0.25,

  playerC: 0.75,

  playerE: 0.50

};



/* =========================================================
   TOTALS
   ========================================================= */

const TOTAL_INDEPENDENT_THROWS =
  48;

const TOTAL_FORCED_THROWS =
  24;

const TOTAL_THROWS =
  72;



/* =========================================================
   FORCED QUOTAS

   EXACTLY:

   Participant = 6
   Taylor      = 6
   Alex        = 6
   User        = 6

   Participant forced throws:

   2 -> Taylor
   2 -> Alex
   2 -> User
   ========================================================= */

const forcedCounts = {

  player0: 0,

  playerB: 0,

  playerC: 0,

  playerE: 0

};


const participantForcedTargets = {

  playerB: 0,

  playerC: 0,

  playerE: 0

};

const participantForcedQuotaBySource = {

  playerB: 2,

  playerC: 2,

  playerE: 2

};

/* =========================================================
   RANDOM FORCED SCHEDULE

   24 planned forced events.

   Six independent slots at the end are kept
   as a safety buffer.

   If a forced event cannot happen at its
   planned moment, it is carried forward
   until the next possible independent throw.

   This keeps the forced events distributed,
   while still guaranteeing the exact quotas.
   ========================================================= */

function shuffleArray(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }


  return array;

}




/* =========================================================
   PARTICIPANT FORCED SOURCE PLAN

   Fixed: 2 from B + 2 from C + 2 from E.
   ========================================================= */

console.log(
  "Participant forced source quota:",
  participantForcedQuotaBySource
);



function createForcedSchedule() {

  /*
     First 42 independent throws:

     24 planned forced
     18 normal

     Last 6 are reserve slots.
  */

  const firstPart = [];


  for (
    let i = 0;
    i < 24;
    i++
  ) {

    firstPart.push(
      true
    );

  }


  for (
    let i = 0;
    i < 18;
    i++
  ) {

    firstPart.push(
      false
    );

  }


  shuffleArray(
    firstPart
  );


  return firstPart.concat(
    [
      false,
      false,
      false,
      false,
      false,
      false
    ]
  );

}


let forcedSchedule =
  createForcedSchedule();


console.log(
  "Forced schedule:",
  forcedSchedule
);


/* =========================================================
   GAME STATE
   ========================================================= */

let roundNumber =
  1;


let currentPlayer =
  "playerB";


let previousPlayer =
  null;


let totalThrows =
  0;


let independentThrowsCompleted =
  0;


let forcedThrowsCompleted =
  0;


let gameEnded =
  false;


let gameLog =
  [];


let lastPlayerReceiveTime =
  null;



/*
   Forced event waiting to happen.

   Example:

   holder   = participant
   returnTo = Taylor

   means participant must return
   the star to Taylor.
*/

let pendingForced =
  null;



/*
   If a planned forced throw could not
   happen yet, it remains as "debt"
   until the next eligible independent throw.
*/

let forcedDebt =
  0;



/*
   Prevent the same independent schedule
   position from being registered twice
   while waiting for the participant.
*/

let independentSlotPrepared =
  false;



/* =========================================================
   CONTINGENT RETURN STATE

   Used only after a FREE independent
   participant throw.

   0 = direct independent return
   2 = two AI hops before return
   ========================================================= */

let contingentActive =
  false;


let remainingHopsBeforeReturn =
  0;



/* =========================================================
   PLAYER NAME
   ========================================================= */

function getPlayerName(
  playerId
) {

  if (
    playerId === "player0"
  ) {

    return nickname;

  }


  const player =
    document.getElementById(
      playerId
    );


  if (!player) {

    return playerId;

  }


  const name =
    player.querySelector(
      ".player-name"
    );


  return (
    name
      ? name.innerText
      : playerId
  );

}



/* =========================================================
   BALL SHAPE
   ========================================================= */

function setBallShape(
  forced
) {

  const ball =
    document.getElementById(
      "ball"
    );


  if (!ball) {
    return;
  }


  if (forced) {

    ball.classList.add(
      "forced-ball"
    );

  }

  else {

    ball.classList.remove(
      "forced-ball"
    );

  }

}



/* =========================================================
   TEXT
   ========================================================= */

function clearForcedNote() {

  const note =
    document.getElementById(
      "forced-note"
    );


  if (note) {

    note.innerText = "";

  }

}



function updateInstruction() {

  const info =
    document.getElementById(
      "info"
    );


  if (!info) {
    return;
  }


  clearForcedNote();



  /* =====================================================
     CURRENT THROW IS FORCED
     ===================================================== */

  if (
    pendingForced
  ) {


    if (
      currentPlayer === "player0"
    ) {

      info.innerText =
        "★ Forced throw: You must return the star to the player who just threw the ball to you.";

    }

    else {

      info.innerText =
        "★ Forced throw: " +
        getPlayerName(
          currentPlayer
        ) +
        " must return the star to the player who just threw the ball to them.";

    }


    return;

  }



  /* =====================================================
     NORMAL PARTICIPANT TURN
     ===================================================== */

  if (
    currentPlayer === "player0"
  ) {

    info.innerText =
      "Your turn.";

  }


  /* =====================================================
     NORMAL AI TURN

     No more "Taylor passed to Alex"
     ===================================================== */

  else {

    info.innerText =
      "";

  }

}



/* =========================================================
   PREPARE CURRENT INDEPENDENT SLOT
   ========================================================= */

function prepareIndependentSlot() {

  if (
    independentSlotPrepared
  ) {
    return;
  }


  if (
    independentThrowsCompleted >=
    TOTAL_INDEPENDENT_THROWS
  ) {
    return;
  }


  /*
     Add the planned forced event,
     if this position has one.
  */

  if (
    forcedSchedule[
      independentThrowsCompleted
    ]
  ) {

    forcedDebt++;

  }


  independentSlotPrepared =
    true;

}



/* =========================================================
   CAN THIS RECEIVER HAVE A FORCED THROW?
   ========================================================= */

function canReceiverBeForced(
  senderId,
  receiverId
) {


  /*
     Participant forced throw.

     Participant has 6 total:
     exactly 2 from B,
     exactly 2 from C,
     exactly 2 from E.
  */

  if (
    receiverId === "player0"
  ) {


    if (
      senderId === "player0"
    ) {

      return false;

    }


    if (
      forcedCounts.player0 >= 6
    ) {

      return false;

    }


    const sourceQuota =
      participantForcedQuotaBySource[
        senderId
      ] || 0;


    if (
      sourceQuota <= 0 ||
      participantForcedTargets[
        senderId
      ] >= sourceQuota
    ) {

      return false;

    }


    return true;

  }


  /*
     AI forced throw.
  */

  if (
    aiPlayers.includes(
      receiverId
    )
  ) {


    return (
      forcedCounts[
        receiverId
      ] < 6
    );

  }


  return false;

}



/* =========================================================
   CHOOSE FORCED RECEIVER FOR AI

   The receiver of the independent ball
   will be the player who performs
   the forced return.
   ========================================================= */

function chooseForcedReceiver(
  senderId
) {


  /*
     First priority:

     If THIS sender still owes one of its
     two participant forced throws,
     send to participant.
  */

  const participantQuotaFromSender =
    participantForcedQuotaBySource[
      senderId
    ] || 0;


  if (
    forcedCounts.player0 < 6 &&
    participantQuotaFromSender > 0 &&
    participantForcedTargets[
      senderId
    ] < participantQuotaFromSender
  ) {

    return "player0";

  }



  /*
     Otherwise choose an AI who still
     needs forced throws.

     Sender cannot throw to themselves.
  */

  const eligible =
    aiPlayers.filter(
      function(playerId) {

        return (
          playerId !== senderId &&
          forcedCounts[
            playerId
          ] < 6
        );

      }
    );


  if (
    eligible.length === 0
  ) {

    return null;

  }



  /*
     Prefer whoever has the most
     forced throws remaining.
  */

  let largestRemaining =
    -1;


  eligible.forEach(
    function(playerId) {

      const remaining =
        6 -
        forcedCounts[
          playerId
        ];


      if (
        remaining >
        largestRemaining
      ) {

        largestRemaining =
          remaining;

      }

    }
  );


  const best =
    eligible.filter(
      function(playerId) {

        return (
          6 -
          forcedCounts[
            playerId
          ] ===
          largestRemaining
        );

      }
    );


  return (
    best[
      Math.floor(
        Math.random() *
        best.length
      )
    ]
  );

}



/* =========================================================
   SETUP TRANSFER

   Sometimes the AI holding the ball
   is the only player who still needs
   forced throws.

   It cannot throw to itself.

   In that case make one normal AI-to-AI
   throw first, so another AI can create
   the required forced throw next.
   ========================================================= */

function chooseSetupTransfer(
  senderId
) {


  /*
     If participant still needs forced throws
     from another specific AI,
     move the ball to that AI.
  */

  const participantSourcesNeeded =
    aiPlayers.filter(
      function(playerId) {

        const quota =
          participantForcedQuotaBySource[
            playerId
          ] || 0;


        return (
          playerId !== senderId &&
          quota > 0 &&
          participantForcedTargets[
            playerId
          ] < quota
        );

      }
    );


  if (
    participantSourcesNeeded.length > 0
  ) {

    return (
      participantSourcesNeeded[0]
    );

  }



  /*
     If the CURRENT AI itself still needs
     forced throws, give the ball to
     another AI first.
  */

  if (
    forcedCounts[
      senderId
    ] < 6
  ) {

    const others =
      aiPlayers.filter(
        function(playerId) {

          return (
            playerId !== senderId
          );

        }
      );


    return (
      others[
        Math.floor(
          Math.random() *
          others.length
        )
      ]
    );

  }



  /*
     Final safety fallback.
  */

  const others =
    aiPlayers.filter(
      function(playerId) {

        return (
          playerId !== senderId
        );

      }
    );


  return (
    others[
      Math.floor(
        Math.random() *
        others.length
      )
    ]
  );

}



/* =========================================================
   WAITING
   ========================================================= */

function startWaiting() {

  if (gameStarted) {
    return;
  }


  gameStarted =
    true;


  document
    .getElementById(
      "loading-screen"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "waiting-screen"
    )
    .style.display =
    "flex";


  setTimeout(
    startGame,
    4000
  );

}



/* =========================================================
   START GAME
   ========================================================= */

function startGame() {

  document
    .getElementById(
      "waiting-screen"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "game-screen"
    )
    .style.display =
    "block";


  currentPlayer =
    "playerB";


  previousPlayer =
    null;


  setBallShape(
    false
  );


  updateBallHolderVisual(
    currentPlayer
  );



  /* =====================================================
     PARTICIPANT CLICK LISTENER
     ===================================================== */

  document
    .querySelectorAll(
      ".player"
    )
    .forEach(
      function(player) {

        player.addEventListener(
          "click",
          function() {


            if (
              gameEnded ||
              currentPlayer !==
              "player0"
            ) {

              return;

            }



            /*
               Cannot throw to self.
            */

            if (
              this.id === "player0"
            ) {

              return;

            }



            /* ===========================================
               PARTICIPANT FORCED THROW
               =========================================== */

            if (
              pendingForced
            ) {


              if (
                this.id !==
                pendingForced.returnTo
              ) {


                const note =
                  document.getElementById(
                    "forced-note"
                  );


                if (note) {

                  note.innerText =
                    "This is not the player who just threw the ball to you.";

                }


                return;

              }


              clearForcedNote();


              processForcedThrow(
                "player0",
                this.id
              );


              return;

            }



            /* ===========================================
               NORMAL PARTICIPANT THROW
               =========================================== */

            clearForcedNote();


            const wantForced =
              forcedDebt > 0;


            const shouldCreateForced =
              (
                wantForced &&
                canReceiverBeForced(
                  "player0",
                  this.id
                )
              );


            processIndependentThrow(
              "player0",
              this.id,
              "Player",
              shouldCreateForced
            );

          }
        );

      }
    );


  prepareTurn();

}



/* =========================================================
   PREPARE TURN
   ========================================================= */

function prepareTurn() {

  if (gameEnded) {
    return;
  }



  /*
     All 48 independent throws finished.

     A final pending forced may still
     need to happen.
  */

  if (
    independentThrowsCompleted >=
      TOTAL_INDEPENDENT_THROWS &&
    !pendingForced
  ) {


    endGame();

    return;

  }



  /* =====================================================
     FORCED TURN
     ===================================================== */

  if (
    pendingForced
  ) {


    setBallShape(
      true
    );


    updateInstruction();



    /*
       Participant:
       wait for click.
    */

    if (
      currentPlayer ===
      "player0"
    ) {

      return;

    }



    /*
       AI forced throw:
       automatic return.
    */

    setTimeout(
      function() {

        if (
          !gameEnded &&
          pendingForced
        ) {


          processForcedThrow(
            currentPlayer,
            pendingForced.returnTo
          );

        }

      },
      getRandomDelay()
    );


    return;

  }



  /* =====================================================
     NEXT THROW IS INDEPENDENT
     ===================================================== */

  setBallShape(
    false
  );


  prepareIndependentSlot();


  updateInstruction();



  /*
     Participant:
     wait for free choice.
  */

  if (
    currentPlayer ===
    "player0"
  ) {

    return;

  }



  /*
     AI independent turn.
  */

  setTimeout(
    function() {

      aiIndependentTurn();

    },
    getRandomDelay()
  );

}



/* =========================================================
   AI INDEPENDENT TURN
   ========================================================= */

function aiIndependentTurn() {

  if (
    gameEnded ||
    pendingForced ||
    currentPlayer === "player0"
  ) {

    return;

  }


  const senderId =
    currentPlayer;


  const wantForced =
    forcedDebt > 0;



  /* =====================================================
     A FORCED EVENT IS DUE
     ===================================================== */

  if (
    wantForced
  ) {


    const receiver =
      chooseForcedReceiver(
        senderId
      );



    /*
       We can create a forced event now.
    */

    if (
      receiver
    ) {


      processIndependentThrow(
        senderId,
        receiver,
        "AI",
        true
      );


      return;

    }



    /*
       No valid forced receiver from
       current sender.

       Do a setup transfer first.

       Forced debt remains and will
       be fulfilled on the next
       possible independent throw.
    */

    const setupTarget =
      chooseSetupTransfer(
        senderId
      );


    processIndependentThrow(
      senderId,
      setupTarget,
      "AI",
      false,
      true
    );


    return;

  }



  /* =====================================================
     NORMAL INDEPENDENT AI BEHAVIOR
     ===================================================== */

  let next;



  /*
     Participant previously made
     a FREE independent throw.
  */

  if (
    contingentActive
  ) {


    /*
       Non-return outcome:

       two intermediate AI hops.
    */

    if (
      remainingHopsBeforeReturn > 0
    ) {


      const otherAIs =
        aiPlayers.filter(
          function(playerId) {

            return (
              playerId !==
              senderId
            );

          }
        );


      next =
        otherAIs[
          Math.floor(
            Math.random() *
            otherAIs.length
          )
        ];


      remainingHopsBeforeReturn--;

    }



    /*
       Return to participant.
    */

    else {


      next =
        "player0";


      contingentActive =
        false;

    }

  }



  /*
     No active contingent response.
     Default AI behavior:
     throw to participant.
  */

  else {


    next =
      "player0";

  }



  processIndependentThrow(
    senderId,
    next,
    "AI",
    false
  );

}



/* =========================================================
   PROCESS INDEPENDENT THROW
   ========================================================= */

function processIndependentThrow(
  fromId,
  toId,
  type,
  shouldCreateForced,
  isSetupTransfer
) {

  if (gameEnded) {
    return;
  }


  if (
    independentThrowsCompleted >=
      TOTAL_INDEPENDENT_THROWS
  ) {

    console.error(
      "Too many independent throws."
    );

    return;

  }



  setBallShape(
    false
  );


  clearForcedNote();



  totalThrows++;

  independentThrowsCompleted++;


  independentSlotPrepared =
    false;



  /*
     If this independent throw
     successfully creates a forced
     event, one item of forced debt
     has been fulfilled.
  */

  if (
    shouldCreateForced
  ) {


    forcedDebt =
      Math.max(
        0,
        forcedDebt - 1
      );

  }



  const senderId =
    fromId;



  updateBallHolder(
    toId,
    senderId
  );



  /* =====================================================
     PARTICIPANT INDEPENDENT THROW
     ===================================================== */

  if (
    type === "Player"
  ) {


    const rt =
      lastPlayerReceiveTime
        ? Date.now() -
          lastPlayerReceiveTime
        : null;


    lastPlayerReceiveTime =
      null;



    gameLog.push({

      throwNum:
        totalThrows,

      throwType:
        "independent",

      forced:
        false,

      createsForcedReturn:
        shouldCreateForced,

      from:
        nickname,

      fromId:
        "player0",

      to:
        getPlayerName(
          toId
        ),

      targetId:
        toId,

      rt:
        rt,

      timestamp:
        Date.now()

    });



    /*
       If this throw is about to create
       a forced return, DO NOT apply
       the 25/75/50 independent
       returning probability.

       The response is forced.
    */

    if (
      shouldCreateForced
    ) {


      contingentActive =
        false;


      remainingHopsBeforeReturn =
        0;

    }



    /*
       FREE independent participant throw:

       apply fixed returning rate.
    */

    else {


      const returnProb =
        returningRates[
          toId
        ];


      contingentActive =
        true;


      if (
        Math.random() <
        returnProb
      ) {


        remainingHopsBeforeReturn =
          0;

      }


      else {


        remainingHopsBeforeReturn =
          2;

      }

    }

  }



  /* =====================================================
     AI INDEPENDENT THROW
     ===================================================== */

  else {


    gameLog.push({

      throwNum:
        totalThrows,

      throwType:
        "independent",

      forced:
        false,

      createsForcedReturn:
        shouldCreateForced,

      setupTransfer:
        !!isSetupTransfer,

      from:
        getPlayerName(
          fromId
        ),

      fromId:
        fromId,

      to:
        getPlayerName(
          toId
        ),

      targetId:
        toId,

      timestamp:
        Date.now()

    });

  }



  /* =====================================================
     SCHEDULE FORCED RETURN
     ===================================================== */

  if (
    shouldCreateForced
  ) {


    pendingForced = {

      holder:
        toId,

      returnTo:
        fromId

    };

  }



  /*
     Keep the CIRCLE visible while
     the independent throw moves.

     After arrival, prepare the next turn.
  */

  setTimeout(
    function() {

      prepareTurn();

    },
    650
  );

}



/* =========================================================
   PROCESS FORCED THROW
   ========================================================= */

function processForcedThrow(
  fromId,
  toId
) {

  if (
    gameEnded ||
    !pendingForced
  ) {

    return;

  }



  /*
     Safety:
     forced holder and return target
     must be exactly correct.
  */

  if (
    fromId !==
      pendingForced.holder ||
    toId !==
      pendingForced.returnTo
  ) {


    console.error(
      "Invalid forced throw:",
      {
        fromId:
          fromId,

        toId:
          toId,

        pendingForced:
          pendingForced
      }
    );


    return;

  }



  if (
    forcedThrowsCompleted >=
      TOTAL_FORCED_THROWS
  ) {


    console.error(
      "Too many forced throws."
    );


    return;

  }



  setBallShape(
    true
  );


  clearForcedNote();



  let rt =
    null;


  if (
    fromId === "player0"
  ) {


    rt =
      lastPlayerReceiveTime
        ? Date.now() -
          lastPlayerReceiveTime
        : null;


    lastPlayerReceiveTime =
      null;

  }



  totalThrows++;

  forcedThrowsCompleted++;



  /* =====================================================
     UPDATE EXACT FORCED COUNTS
     ===================================================== */

  forcedCounts[
    fromId
  ]++;



  /*
     Participant forced throw:

     record WHO participant
     had to return it to.
  */

  if (
    fromId === "player0"
  ) {


    participantForcedTargets[
      toId
    ]++;

  }



  gameLog.push({

    throwNum:
      totalThrows,

    throwType:
      "forced",

    forced:
      true,

    from:
      getPlayerName(
        fromId
      ),

    fromId:
      fromId,

    to:
      getPlayerName(
        toId
      ),

    targetId:
      toId,

    rt:
      rt,

    timestamp:
      Date.now()

  });



  const senderId =
    fromId;



  pendingForced =
    null;



  updateBallHolder(
    toId,
    senderId
  );



  /*
     Keep STAR visible while it moves.

     After arrival, next independent
     throw returns to a normal circle.
  */

  setTimeout(
    function() {

      prepareTurn();

    },
    650
  );

}



/* =========================================================
   UPDATE BALL HOLDER
   ========================================================= */

function updateBallHolderVisual(
  newHolder
) {


  const target =
    document.getElementById(
      newHolder
    );


  if (!target) {
    return;
  }


  document
    .querySelectorAll(
      ".player"
    )
    .forEach(
      function(player) {

        player.classList.remove(
          "has-ball"
        );

      }
    );


  target.classList.add(
    "has-ball"
  );


  moveBall(
    newHolder
  );


  currentPlayer =
    newHolder;

}



function updateBallHolder(
  newHolder,
  senderId
) {


  previousPlayer =
    senderId;


  updateBallHolderVisual(
    newHolder
  );


  if (
    newHolder === "player0"
  ) {


    lastPlayerReceiveTime =
      Date.now();

  }

}



/* =========================================================
   MOVE BALL
   ========================================================= */

function moveBall(
  targetId
) {


  const ball =
    document.getElementById(
      "ball"
    );


  const target =
    document.getElementById(
      targetId
    );


  const container =
    document.getElementById(
      "game-container"
    );


  if (
    !ball ||
    !target ||
    !container
  ) {

    return;

  }


  const tRect =
    target.getBoundingClientRect();


  const cRect =
    container.getBoundingClientRect();


  const x =
    tRect.left -
    cRect.left +
    target.offsetWidth / 2 -
    ball.offsetWidth / 2;


  const y =
    tRect.top -
    cRect.top +
    target.offsetHeight / 2 -
    ball.offsetHeight / 2;


  ball.style.left =
    x + "px";


  ball.style.top =
    y + "px";

}



/* =========================================================
   RANDOM AI DELAY
   ========================================================= */

function getRandomDelay() {

  return (
    Math.floor(
      Math.random() *
      800
    ) +
    1200
  );

}



/* =========================================================
   END GAME
   ========================================================= */

function restartForSecondRound() {

  console.log(
    "Round 2 starts seamlessly"
  );


  roundNumber =
    2;


  /* =====================================================
     RESET FORCED COUNTS
     ===================================================== */

  forcedCounts.player0 = 0;
  forcedCounts.playerB = 0;
  forcedCounts.playerC = 0;
  forcedCounts.playerE = 0;


  /* =====================================================
     RESET PARTICIPANT 2 + 2 + 2
     ===================================================== */

  participantForcedTargets.playerB = 0;
  participantForcedTargets.playerC = 0;
  participantForcedTargets.playerE = 0;


  /* =====================================================
     NEW RANDOM FORCED SCHEDULE
     ===================================================== */

  forcedSchedule =
    createForcedSchedule();


  console.log(
    "Round 2 forced schedule:",
    forcedSchedule
  );


  /* =====================================================
     RESET ROUND STATE

     IMPORTANT:
     currentPlayer is intentionally NOT changed.
     The ball stays where it already is, so the
     participant does not see a visual restart.
     ===================================================== */

  previousPlayer =
    null;

  totalThrows =
    0;

  independentThrowsCompleted =
    0;

  forcedThrowsCompleted =
    0;

  gameLog =
    [];

  pendingForced =
    null;

  forcedDebt =
    0;

  independentSlotPrepared =
    false;

  contingentActive =
    false;

  remainingHopsBeforeReturn =
    0;


  /* If You currently hold the ball, start RT timing
     naturally from the beginning of round 2. */

  lastPlayerReceiveTime =
    currentPlayer === "player0"
      ? Date.now()
      : null;


  setBallShape(
    false
  );


  clearForcedNote();


  /* Re-enable the game without showing any
     loading / waiting / round transition screen. */

  gameEnded =
    false;


  prepareTurn();

}



/* =========================================================
   END GAME / END ROUND
   ========================================================= */

function endGame() {

  if (gameEnded) {
    return;
  }


  gameEnded =
    true;



  /* =====================================================
     FINAL SAFETY CHECK
     ===================================================== */

  const finalCountsCorrect = (

    independentThrowsCompleted === 48 &&

    forcedThrowsCompleted === 24 &&

    forcedCounts.player0 === 6 &&

    forcedCounts.playerB === 6 &&

    forcedCounts.playerC === 6 &&

    forcedCounts.playerE === 6 &&

    participantForcedTargets.playerB === 2 &&

    participantForcedTargets.playerC === 2 &&

    participantForcedTargets.playerE === 2

  );



  console.log(
    "FINAL GAME COUNTS - ROUND " +
    roundNumber +
    ":",
    {

      totalThrows:
        totalThrows,

      independentThrows:
        independentThrowsCompleted,

      forcedThrows:
        forcedThrowsCompleted,

      forcedByPlayer:
        forcedCounts,

      participantForcedTargets:
        participantForcedTargets,

      finalCountsCorrect:
        finalCountsCorrect

    }
  );



  gameLog.push({

    logType:
      "GameSummary",

    round:
      roundNumber,

    totalThrows:
      totalThrows,

    independentThrows:
      independentThrowsCompleted,

    forcedThrows:
      forcedThrowsCompleted,

    participantForced:
      forcedCounts.player0,

    taylorForced:
      forcedCounts.playerB,

    alexForced:
      forcedCounts.playerC,

    userForced:
      forcedCounts.playerE,

    participantForcedToTaylor:
      participantForcedTargets.playerB,

    participantForcedToAlex:
      participantForcedTargets.playerC,

    participantForcedToUser:
      participantForcedTargets.playerE,

    finalCountsCorrect:
      finalCountsCorrect,

    timestamp:
      Date.now()

  });



  const gameLogString =
    JSON.stringify(
      gameLog
    );



  /* =====================================================
     ROUND 1 FINISHED

     Save ONLY Round 1 to Qualtrics.
     Qualtrics receives CyberCatchLog and shows Next.

     Round 2 then begins invisibly inside the iframe.
     ===================================================== */

  if (
    roundNumber === 1
  ) {


    if (
      window.Qualtrics &&
      Qualtrics.SurveyEngine
    ) {


      if (
        Qualtrics.SurveyEngine
          .setJSEmbeddedData
      ) {


        Qualtrics.SurveyEngine
          .setJSEmbeddedData(
            "CyberCatchLog",
            gameLogString
          );

      }


      else {


        Qualtrics.SurveyEngine
          .setEmbeddedData(
            "CyberCatchLog",
            gameLogString
          );

      }

    }


    else {


      window.parent.postMessage(
        {

          type:
            "CyberCatchLog",

          gameLog:
            gameLogString,

          participant_name:
            nickname,

          participant_icon:
            participantIcon,

          participant_color:
            participantColor

        },
        "*"
      );

    }


    console.log(
      "Round 1 log sent to Qualtrics. Starting Round 2."
    );


    /* No transition screen and no restart message. */

    restartForSecondRound();

    return;

  }



  /* =====================================================
     ROUND 2 FINISHED

     Do NOT overwrite CyberCatchLog.
     If the participant has not clicked Next yet,
     show the normal end screen.
     ===================================================== */

  document.body.innerHTML = `

    <div
      style="
        background-color:#d3d3d3;
        width:100vw;
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        flex-direction:column;
      "
    >

      <div
        style="
          font-size:24px;
          font-weight:bold;
          color:#2c3e50;
        "
      >

        The task has ended. Thank you!

      </div>

    </div>

  `;

}


</script>
