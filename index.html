<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

  <link
    href="https://fonts.cdnfonts.com/css/jungle-adventurer"
    rel="stylesheet"
  >

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CyberCatch</title>


  <style>

    body {
      font-family: 'Jungle Adventurer', Arial, sans-serif !important;
      text-align: center;
      background-color: #d3d3d3;
      color: black;
      overflow: hidden;
      padding-top: 20px;
      margin: 0;
    }


    h1 {
      margin-bottom: 5px;
    }


    #instruction-text {
      margin-top: 5px;
    }


    .game-container {
      position: relative;
      width: 450px;
      height: 400px;
      margin: 25px auto 10px;
    }


    .player {
      width: 80px;
      height: 80px;

      border-radius: 50%;
      position: absolute;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      font-weight: bold;
      color: white;

      cursor: pointer;

      border: 3px solid transparent;
      box-sizing: border-box;

      z-index: 2;
    }


    .player.has-ball {
      border-color: #2ecc71;
    }


    .avatar-icon {
      font-size: 34px;
      line-height: 34px;
      pointer-events: none;
    }


    .player-name {
      font-size: 11px;
      margin-top: 3px;

      max-width: 70px;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;

      pointer-events: none;
    }


    .error-icon {
      font-size: 30px;
      line-height: 30px;
    }


    /* =====================================================
       NORMAL BALL
       ===================================================== */

    .ball {
      width: 24px;
      height: 24px;

      background-color: #2ecc71;

      border-radius: 50%;

      position: absolute;

      transition:
        left 0.6s ease-in-out,
        top 0.6s ease-in-out;

      z-index: 5;

      pointer-events: none;
    }


    /* =====================================================
       FORCED BALL = STAR
       ===================================================== */

    .ball.forced-ball {

      border-radius: 0;

      clip-path: polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 92%,
        50% 70%,
        21% 92%,
        32% 57%,
        2% 35%,
        39% 35%
      );
    }


    #loading-screen,
    #waiting-screen {

      position: fixed;

      width: 100%;
      height: 100%;

      top: 0;
      left: 0;

      background: #d3d3d3;

      justify-content: center;
      align-items: center;
      flex-direction: column;

      z-index: 10;
    }


    #loading-screen {
      display: flex;
    }


    #waiting-screen {
      display: none;
    }


    #waiting-screen img {
      width: 100px;
      margin-top: 20px;
    }


    #end-early-btn {

      font-family:
        'Jungle Adventurer',
        Arial,
        sans-serif !important;

      margin-top: 15px;

      padding: 10px 20px;

      font-size: 16px;

      cursor: pointer;

      background-color: #e74c3c;

      color: white;

      border: none;

      border-radius: 5px;

      display: none;
    }


    #info {
      min-height: 24px;
      margin-top: -5px;
      font-weight: bold;
      font-size: 16px;
    }


    /* Extra note shown only when participant
       clicks the wrong player during forced throw */

    #forced-note {
      min-height: 20px;
      margin-top: 4px;

      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: normal;
    }


  </style>

</head>


<body>


<!-- =====================================================
     LOADING
     ===================================================== -->

<div id="loading-screen">

  <h2>
    Loading...
  </h2>

</div>



<!-- =====================================================
     WAITING
     ===================================================== -->

<div id="waiting-screen">

  <h2>
    Waiting for other players to log in...
  </h2>

  <img
    src="https://icon-library.com/images/waiting-icon-gif/waiting-icon-gif-1.jpg"
    alt="Waiting..."
  >

</div>



<!-- =====================================================
     GAME
     ===================================================== -->

<div
  id="game-screen"
  style="display:none;"
>


  <h1>
    CyberCatch
  </h1>


  <p id="instruction-text">
    Click on a player to pass the ball when it's your turn.
  </p>



  <div
    class="game-container"
    id="game-container"
  >


    <!-- =================================================
         TAYLOR
         TOP
         ================================================= -->

    <div
      class="player"
      id="playerB"
      style="
        left:185px;
        top:20px;
        background-color:#F5B041;
      "
    >

      <div class="avatar-icon">
        🐰
      </div>

      <div class="player-name">
        Taylor
      </div>

    </div>



    <!-- =================================================
         ALEX
         RIGHT
         ================================================= -->

    <div
      class="player"
      id="playerC"
      style="
        left:335px;
        top:150px;
        background-color:#AF7AC5;
      "
    >

      <div class="avatar-icon">
        🐧
      </div>

      <div class="player-name">
        Alex
      </div>

    </div>



    <!-- =================================================
         PLAYER E
         ERROR
         LEFT
         ================================================= -->

    <div
      class="player"
      id="playerE"
      style="
        left:35px;
        top:150px;
        background-color:#8c8c8c;
      "
    >

      <div class="avatar-icon error-icon">
        ⚠
      </div>

      <div class="player-name">
        User
      </div>

    </div>



    <!-- =================================================
         PARTICIPANT
         BOTTOM
         ICON + COLOR FROM QUALTRICS
         ================================================= -->

    <div
      class="player"
      id="player0"
      style="
        left:185px;
        top:280px;
        background-color:#808080;
      "
    >

      <div
        class="avatar-icon"
        id="participant-avatar-icon"
      ></div>

      <div
        class="player-name"
        id="participant-avatar-name"
      >
        You
      </div>

    </div>



    <div
      class="ball"
      id="ball"
    ></div>


  </div>



  <!-- ===================================================
       INSTRUCTION AREA
       =================================================== -->

  <div
    class="info"
    id="info"
  >
    The game is starting...
  </div>


  <div id="forced-note"></div>



  <button
    id="end-early-btn"
    onclick="endGame()"
  >
    End Game
  </button>


</div>



<script>


/* =========================================================
   PARTICIPANT DATA FROM QUALTRICS
   ========================================================= */

let nickname = "You";

let participantIcon = "";

let participantColor = "";

let participantDataReceived = false;

let gameStarted = false;



/* =========================================================
   PARTICIPANT ICON MAP
   ========================================================= */

const iconMap = {

  "1": "🐶",
  "2": "🐱",
  "3": "🦉",

  "DOG": "🐶",
  "CAT": "🐱",
  "OWL": "🦉"

};



/* =========================================================
   PARTICIPANT COLOR MAP
   ========================================================= */

const colorMap = {

  "1": "#e74c3c",
  "2": "#2ecc71",
  "3": "#ff69b4",

  "RED": "#e74c3c",
  "GREEN": "#2ecc71",
  "PINK": "#ff69b4"

};



/* =========================================================
   APPLY PARTICIPANT AVATAR
   ========================================================= */

function applyParticipantAvatar() {


  const participant =
    document.getElementById(
      "player0"
    );


  const icon =
    document.getElementById(
      "participant-avatar-icon"
    );


  const name =
    document.getElementById(
      "participant-avatar-name"
    );



  if (name) {

    name.innerText =
      nickname || "You";

  }



  if (icon) {


    const rawIcon =
      String(
        participantIcon || ""
      ).trim();


    const normalizedIcon =
      rawIcon.toUpperCase();


    /*
       Allows Qualtrics to send either:
       DOG / CAT / OWL
       1 / 2 / 3
       or the emoji itself
    */

    if (
      rawIcon === "🐶" ||
      rawIcon === "🐱" ||
      rawIcon === "🦉"
    ) {

      icon.innerText =
        rawIcon;

    }

    else {

      icon.innerText =
        iconMap[
          normalizedIcon
        ] || "";

    }

  }



  if (participant) {


    const rawColor =
      String(
        participantColor || ""
      ).trim();


    const normalizedColor =
      rawColor.toUpperCase();


    /*
       If Qualtrics sends a HEX color,
       use it directly.
    */

    if (
      /^#[0-9A-F]{6}$/i.test(
        rawColor
      )
    ) {

      participant.style.backgroundColor =
        rawColor;

    }

    else {

      participant.style.backgroundColor =
        colorMap[
          normalizedColor
        ] || "#808080";

    }

  }

}



/* =========================================================
   RECEIVE DATA FROM QUALTRICS
   ========================================================= */

window.addEventListener(
  "message",
  function(event) {


    if (
      !event.data ||
      typeof event.data !== "object"
    ) {

      return;

    }


    if (
      event.data.type !==
      "CyberCatchParticipantData"
    ) {

      return;

    }



    console.log(
      "CyberCatch received participant data:",
      event.data
    );



    if (
      event.data.participant_name
    ) {

      nickname =
        String(
          event.data.participant_name
        );

    }



    if (
      event.data.participant_icon
    ) {

      participantIcon =
        String(
          event.data.participant_icon
        );

    }



    if (
      event.data.participant_color
    ) {

      participantColor =
        String(
          event.data.participant_color
        );

    }



    applyParticipantAvatar();


    participantDataReceived =
      true;



    if (!gameStarted) {

      startWaiting();

    }

  }
);



/* =========================================================
   TELL QUALTRICS HTML IS READY
   ========================================================= */

let readyAttempts = 0;


function tellQualtricsReady() {


  window.parent.postMessage(
    {
      type: "CyberCatchReady"
    },
    "*"
  );


  readyAttempts++;


  if (
    !participantDataReceived &&
    readyAttempts < 20
  ) {

    setTimeout(
      tellQualtricsReady,
      500
    );

  }

}



window.addEventListener(
  "DOMContentLoaded",
  function() {

    tellQualtricsReady();

  }
);



/* =========================================================
   GAME SETTINGS
   ========================================================= */

const aiPlayers = [

  "playerB",
  "playerC",
  "playerE"

];



/*
   Returning rates apply only
   to independent throws.
*/

const returningRates = {

  playerB: 0.25,

  playerC: 0.75,

  playerE: 0.50

};



const TOTAL_THROWS = 72;

const INDEPENDENT_THROWS_TOTAL = 48;

const FORCED_THROWS_TOTAL = 24;



/* =========================================================
   GAME STATE
   ========================================================= */

let currentPlayer =
  "playerB";


let previousPlayer =
  null;


let totalThrows =
  0;


let independentThrowsCompleted =
  0;


let forcedThrowsCompleted =
  0;


let gameEnded =
  false;


let gameLog =
  [];


let lastPlayerReceiveTime =
  null;


let remainingHopsBeforeReturn =
  0;



/* =========================================================
   THROW SEQUENCE
   ========================================================= */

let throwSequence = [];


function createThrowSequence() {


  const blocks = [];


  /*
     24 blocks:
     Independent -> Forced
  */

  for (
    let i = 0;
    i < FORCED_THROWS_TOTAL;
    i++
  ) {

    blocks.push(
      [
        "independent",
        "forced"
      ]
    );

  }



  /*
     24 additional independent throws
  */

  for (
    let i = 0;
    i < 24;
    i++
  ) {

    blocks.push(
      [
        "independent"
      ]
    );

  }



  /*
     Shuffle complete blocks.

     Forced always immediately
     follows an independent throw.
  */

  for (
    let i = blocks.length - 1;
    i > 0;
    i--
  ) {


    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      blocks[i],
      blocks[j]
    ] =
    [
      blocks[j],
      blocks[i]
    ];

  }



  throwSequence =
    blocks.flat();


  console.log(
    "Throw sequence:",
    throwSequence
  );


  console.log(
    "Total sequence length:",
    throwSequence.length
  );

}



createThrowSequence();



/* =========================================================
   IS NEXT THROW FORCED?
   ========================================================= */

function isNextThrowForced() {

  return (
    throwSequence[
      totalThrows
    ] ===
    "forced"
  );

}



/* =========================================================
   PLAYER NAME
   ========================================================= */

function getPlayerName(
  playerId
) {


  if (
    playerId === "player0"
  ) {

    return nickname;

  }


  const player =
    document.getElementById(
      playerId
    );


  if (!player) {

    return playerId;

  }


  const name =
    player.querySelector(
      ".player-name"
    );


  return (
    name
      ? name.innerText
      : playerId
  );

}



/* =========================================================
   BALL SHAPE

   Independent = circle
   Forced      = star
   ========================================================= */

function setBallShape(
  isForced
) {


  const ball =
    document.getElementById(
      "ball"
    );


  if (!ball) {

    return;

  }


  if (isForced) {

    ball.classList.add(
      "forced-ball"
    );

  }

  else {

    ball.classList.remove(
      "forced-ball"
    );

  }

}



/* =========================================================
   CLEAR WRONG-PLAYER NOTE
   ========================================================= */

function clearForcedNote() {


  const note =
    document.getElementById(
      "forced-note"
    );


  if (note) {

    note.innerText = "";

  }

}



/* =========================================================
   UPDATE INSTRUCTION TEXT

   No more:
   "Taylor passed to Alex"
   etc.

   Only:
   - Your turn
   - Forced instructions
   ========================================================= */

function updateTurnMessage(
  holderId
) {


  const info =
    document.getElementById(
      "info"
    );


  if (!info) {

    return;

  }


  clearForcedNote();



  /*
     The next throw is forced.

     Therefore the CURRENT holder
     must return the ball to whoever
     just threw it to them.
  */

  if (
    isNextThrowForced()
  ) {


    if (
      holderId === "player0"
    ) {


      info.innerText =
        "★ Forced throw: Return the ball to the player who threw it to you.";

    }


    else {


      info.innerText =
        "★ Forced throw: " +
        getPlayerName(
          holderId
        ) +
        " must return the ball to the player who threw it to them.";

    }


    return;

  }



  /*
     Normal participant turn
  */

  if (
    holderId === "player0"
  ) {


    info.innerText =
      "Your turn.";

  }


  /*
     Normal AI turn:
     no text about who threw to whom
  */

  else {


    info.innerText =
      "";

  }

}



/* =========================================================
   WAITING
   ========================================================= */

function startWaiting() {


  if (gameStarted) {

    return;

  }


  gameStarted =
    true;


  document
    .getElementById(
      "loading-screen"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "waiting-screen"
    )
    .style.display =
    "flex";


  setTimeout(
    startGame,
    4000
  );

}



/* =========================================================
   START GAME
   ========================================================= */

function startGame() {


  document
    .getElementById(
      "waiting-screen"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "game-screen"
    )
    .style.display =
    "block";


  /*
     Initial ball holder
  */

  currentPlayer =
    "playerB";


  previousPlayer =
    null;


  /*
     First throw is independent,
     therefore normal ball.
  */

  setBallShape(
    isNextThrowForced()
  );


  updateBallHolderVisual(
    currentPlayer
  );


  updateTurnMessage(
    currentPlayer
  );



  /* =======================================================
     PARTICIPANT CLICK
     ======================================================= */

  document
    .querySelectorAll(
      ".player"
    )
    .forEach(
      function(player) {


        player.addEventListener(
          "click",
          function() {


            /*
               Participant can only act
               when participant has ball.
            */

            if (
              gameEnded ||
              currentPlayer !== "player0"
            ) {

              return;

            }



            /*
               Cannot throw to self.
            */

            if (
              this.id === "player0"
            ) {

              return;

            }



            /*
               FORCED THROW:

               Participant can ONLY
               return to previousPlayer.
            */

            if (
              isNextThrowForced() &&
              this.id !== previousPlayer
            ) {


              const note =
                document.getElementById(
                  "forced-note"
                );


              if (note) {


                note.innerText =
                  "This is not the player who last threw the ball to you.";

              }


              return;

            }



            /*
               Correct choice.
            */

            clearForcedNote();


            processThrow(
              "player0",
              this.id,
              "Player"
            );

          }
        );

      }
    );



  /*
     Start AI
  */

  setTimeout(
    function() {

      aiTurn();

    },
    getRandomDelay()
  );

}



/* =========================================================
   PROCESS THROW
   ========================================================= */

function processThrow(
  fromId,
  toId,
  type
) {


  if (gameEnded) {

    return;

  }



  /*
     THIS throw type.
  */

  const throwIsForced =
    isNextThrowForced();



  /*
     Safety checks.
  */

  if (
    throwIsForced &&
    forcedThrowsCompleted >=
      FORCED_THROWS_TOTAL
  ) {


    console.error(
      "Too many forced throws."
    );


    return;

  }



  if (
    !throwIsForced &&
    independentThrowsCompleted >=
      INDEPENDENT_THROWS_TOTAL
  ) {


    console.error(
      "Too many independent throws."
    );


    return;

  }



  const senderId =
    fromId;



  /*
     IMPORTANT:

     During the throw itself:

     Forced -> star
     Independent -> circle
  */

  setBallShape(
    throwIsForced
  );


  clearForcedNote();



  totalThrows++;



  if (
    throwIsForced
  ) {

    forcedThrowsCompleted++;

  }

  else {

    independentThrowsCompleted++;

  }



  /*
     Move ball to receiver.
  */

  updateBallHolder(
    toId,
    senderId
  );



  /* =======================================================
     PARTICIPANT THROW LOG
     ======================================================= */

  if (
    type === "Player"
  ) {


    const rt =
      lastPlayerReceiveTime
        ? Date.now() -
          lastPlayerReceiveTime
        : null;


    lastPlayerReceiveTime =
      null;



    gameLog.push({

      throwNum:
        totalThrows,

      throwType:
        throwIsForced
          ? "forced"
          : "independent",

      forced:
        throwIsForced,

      createsForcedReturn:
        !throwIsForced &&
        isNextThrowForced(),

      from:
        nickname,

      fromId:
        "player0",

      to:
        getPlayerName(
          toId
        ),

      targetId:
        toId,

      rt:
        rt,

      timestamp:
        Date.now()

    });



    /*
       Independent participant -> AI.

       Returning probability determines
       whether that AI returns directly.
    */

    if (
      !throwIsForced &&
      toId !== "player0"
    ) {


      const returnProb =
        returningRates[
          toId
        ];


      if (
        Math.random() <
        returnProb
      ) {


        remainingHopsBeforeReturn =
          0;

      }


      else {


        remainingHopsBeforeReturn =
          2;

      }

    }



    /*
       If next throw is forced,
       forced return overrides
       contingent return plan.
    */

    if (
      !throwIsForced &&
      isNextThrowForced()
    ) {


      remainingHopsBeforeReturn =
        0;

    }

  }



  /* =======================================================
     AI THROW LOG
     ======================================================= */

  else {


    gameLog.push({

      throwNum:
        totalThrows,

      throwType:
        throwIsForced
          ? "forced"
          : "independent",

      forced:
        throwIsForced,

      createsForcedReturn:
        !throwIsForced &&
        isNextThrowForced(),

      from:
        getPlayerName(
          fromId
        ),

      fromId:
        fromId,

      to:
        getPlayerName(
          toId
        ),

      targetId:
        toId,

      timestamp:
        Date.now()

    });

  }



  /* =======================================================
     NEW MESSAGE

     This replaces ALL of the old
     "X passed the ball to Y" text.
     ======================================================= */

  updateTurnMessage(
    toId
  );



  /*
     The moving object keeps the shape
     of THIS throw.

     Once it arrives, change its shape
     to show the type of the receiver's
     NEXT throw.

     So if the receiver now has a forced
     turn, the ball becomes a star while
     they are holding it.
  */

  const nextThrowWillBeForced =
    isNextThrowForced();


  setTimeout(
    function() {


      if (!gameEnded) {


        setBallShape(
          nextThrowWillBeForced
        );

      }

    },
    650
  );



  /*
     End exactly at 72 throws.
  */

  if (
    totalThrows >=
    TOTAL_THROWS
  ) {


    endGame();


    return;

  }



  /*
     If AI has the ball,
     continue automatically.

     If participant has the ball,
     wait for participant click.
  */

  if (
    toId !== "player0"
  ) {


    setTimeout(
      function() {

        aiTurn();

      },
      getRandomDelay()
    );

  }

}



/* =========================================================
   UPDATE BALL HOLDER
   ========================================================= */

function updateBallHolderVisual(
  newHolder
) {


  const target =
    document.getElementById(
      newHolder
    );


  if (!target) {

    return;

  }



  document
    .querySelectorAll(
      ".player"
    )
    .forEach(
      function(player) {


        player.classList.remove(
          "has-ball"
        );

      }
    );



  target.classList.add(
    "has-ball"
  );


  moveBall(
    newHolder
  );


  currentPlayer =
    newHolder;

}



/* =========================================================
   FULL HOLDER UPDATE
   ========================================================= */

function updateBallHolder(
  newHolder,
  senderId
) {


  previousPlayer =
    senderId;


  updateBallHolderVisual(
    newHolder
  );



  /*
     Start RT when participant
     receives the ball.
  */

  if (
    newHolder === "player0"
  ) {


    lastPlayerReceiveTime =
      Date.now();

  }

}



/* =========================================================
   MOVE BALL
   ========================================================= */

function moveBall(
  targetId
) {


  const ball =
    document.getElementById(
      "ball"
    );


  const target =
    document.getElementById(
      targetId
    );


  const container =
    document.getElementById(
      "game-container"
    );


  if (
    !ball ||
    !target ||
    !container
  ) {

    return;

  }



  const tRect =
    target.getBoundingClientRect();


  const cRect =
    container.getBoundingClientRect();



  const x =
    tRect.left -
    cRect.left +
    target.offsetWidth / 2 -
    ball.offsetWidth / 2;



  const y =
    tRect.top -
    cRect.top +
    target.offsetHeight / 2 -
    ball.offsetHeight / 2;



  ball.style.left =
    x + "px";


  ball.style.top =
    y + "px";

}



/* =========================================================
   RANDOM AI DELAY
   ========================================================= */

function getRandomDelay() {


  return (
    Math.floor(
      Math.random() *
      800
    ) +
    1200
  );

}



/* =========================================================
   AI TURN
   ========================================================= */

function aiTurn() {


  if (
    gameEnded ||
    totalThrows >=
      TOTAL_THROWS
  ) {


    endGame();


    return;

  }



  let next;



  /*
     Is THIS upcoming throw forced?
  */

  const throwIsForced =
    isNextThrowForced();



  /* =======================================================
     FORCED AI THROW
     ======================================================= */

  if (
    throwIsForced
  ) {


    /*
       AI must return to whoever
       just threw it the ball.
    */

    next =
      previousPlayer;



    /*
       Safety check.
    */

    if (
      !next ||
      next === currentPlayer
    ) {


      console.error(
        "Invalid forced throw:",
        {

          currentPlayer:
            currentPlayer,

          previousPlayer:
            previousPlayer,

          totalThrows:
            totalThrows

        }
      );


      return;

    }



    /*
       Forced return overrides
       previous contingent plan.
    */

    remainingHopsBeforeReturn =
      0;

  }



  /* =======================================================
     INDEPENDENT AI THROW
     ======================================================= */

  else {


    /*
       Return directly to participant.
    */

    if (
      remainingHopsBeforeReturn ===
      0
    ) {


      next =
        "player0";

    }


    /*
       Intermediate AI -> AI throw.
    */

    else {


      remainingHopsBeforeReturn--;



      const otherAIs =
        aiPlayers.filter(
          function(playerId) {


            return (
              playerId !==
              currentPlayer
            );

          }
        );



      next =
        otherAIs[
          Math.floor(
            Math.random() *
            otherAIs.length
          )
        ];

    }

  }



  processThrow(
    currentPlayer,
    next,
    "AI"
  );

}



/* =========================================================
   END GAME
   ========================================================= */

function endGame() {


  if (gameEnded) {

    return;

  }


  gameEnded =
    true;



  console.log(
    "FINAL GAME COUNTS:",
    {

      totalThrows:
        totalThrows,

      independentThrows:
        independentThrowsCompleted,

      forcedThrows:
        forcedThrowsCompleted

    }
  );



  gameLog.push({

    logType:
      "GameSummary",

    totalThrows:
      totalThrows,

    independentThrows:
      independentThrowsCompleted,

    forcedThrows:
      forcedThrowsCompleted,

    timestamp:
      Date.now()

  });



  const gameLogString =
    JSON.stringify(
      gameLog
    );



  /*
     Direct Qualtrics case.
  */

  if (
    window.Qualtrics &&
    Qualtrics.SurveyEngine
  ) {


    Qualtrics.SurveyEngine
      .setEmbeddedData(
        "CyberCatchLog",
        gameLogString
      );

  }


  /*
     GitHub iframe -> Qualtrics
  */

  else {


    window.parent.postMessage(
      {

        type:
          "CyberCatchLog",

        gameLog:
          gameLogString,

        participant_name:
          nickname,

        participant_icon:
          participantIcon,

        participant_color:
          participantColor

      },
      "*"
    );

  }



  document.body.innerHTML = `

    <div
      style="
        background-color:#d3d3d3;
        width:100vw;
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        flex-direction:column;
      "
    >

      <div
        style="
          font-size:24px;
          font-weight:bold;
          color:#2c3e50;
        "
      >

        The task has ended. Thank you!

      </div>

    </div>

  `;

}


</script>
